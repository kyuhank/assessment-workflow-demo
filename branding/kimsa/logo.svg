      <rect x="13" y="34" width="11" height="18" rx="3.5" fill="#dcf5f1" fill-opacity=".85" stroke="white" stroke-opacity=".6" stroke-width=".6"/>
      <path d="M28 27L42 13Q45 10 48 13L50 15Q53 18 50 21L36 35Z" fill="url(#kimsa-pearl)"/>
      <path d="M28 37L36 29L50 43Q53 46 50 49L48 51Q45 54 42 51Z" fill="#e9fafa" fill-opacity=".9"/>
