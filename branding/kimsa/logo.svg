<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" role="img" aria-label="KIMSA: Modular stock assessment">
  <defs>
    <linearGradient id="kimsa-sea" x1="0" y1="0" x2=".65" y2="1">
      <stop stop-color="#65c8c6"/>
      <stop offset="1" stop-color="#116a7a"/>
    </linearGradient>
    <linearGradient id="kimsa-pearl" x1="0" y1="0" x2=".3" y2="1">
      <stop stop-color="#fff"/>
      <stop offset=".5" stop-color="#f5fafc"/>
      <stop offset="1" stop-color="#dfecef"/>
    </linearGradient>
    <radialGradient id="kimsa-light" cx=".15" cy="0" r=".9">
      <stop stop-color="#fff" stop-opacity=".57"/>
      <stop offset=".65" stop-color="#fff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kimsa-edge" x1="0" y1="0" x2=".6" y2="1">
      <stop stop-color="#fff" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".4"/>
    </linearGradient>
    <filter id="kimsa-lift" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1.3" stdDeviation="1.4" flood-color="#15354d" flood-opacity=".19"/>
    </filter>
  </defs>
  <g transform="translate(0 8)">
    <rect x="1" y="1" width="62" height="62" rx="17" fill="url(#kimsa-sea)"/>
    <rect x="1.6" y="1.6" width="60.8" height="60.8" rx="16.4" fill="url(#kimsa-light)" stroke="url(#kimsa-edge)" stroke-width=".9"/>
    <path d="M7 23V19C7 11 12 7 20 7H39" fill="none" stroke="#fff" stroke-width=".8" stroke-opacity=".24" stroke-linecap="round"/>
