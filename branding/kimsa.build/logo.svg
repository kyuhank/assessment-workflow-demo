  <text x="82" y="32" font-family="Inter, system-ui, DejaVu Sans, sans-serif" font-size="18" font-weight="500" letter-spacing="1.2" fill="#526b78">KIMSA</text>
  <text x="81" y="65" font-family="Inter, system-ui, DejaVu Sans, sans-serif" font-size="32" font-weight="600" letter-spacing="-.7" fill="#243d49">Build</text>
