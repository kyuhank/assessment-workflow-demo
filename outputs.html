<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Supplementary outputs</title>
<style>:root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #17333d; background: #f5f7f8; }
* { box-sizing: border-box; }
body { margin: 0; }
main { max-width: 1040px; margin: auto; padding: 32px 28px 64px; }
nav { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 24px; font-size: 13px; }
a { color: #176b78; text-decoration: none; }
a:hover { text-decoration: underline; }
header { margin: 48px 0 28px; }
.eyebrow { color: #176b78; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
h1 { font-size: clamp(28px, 4vw, 40px); font-weight: 650; letter-spacing: -.03em; margin: 12px 0; }
header p { color: #61737b; line-height: 1.6; font-size: 14px; }
label { display: block; font-size: 13px; margin-bottom: 8px; }
input { width: 100%; max-width: 440px; background: white; border: 1px solid #d5e1e4; border-radius: 8px; padding: 12px 14px; font: inherit; font-size: 14px; }
.studies { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 28px; }
article { min-width: 0; background: white; border: 1px solid #dfe7ea; border-radius: 12px; padding: 22px; }
h2 { font-size: 17px; font-weight: 600; letter-spacing: -.015em; margin: 0 0 18px; }
.links { display: flex; flex-wrap: wrap; gap: 10px 20px; font-size: 13px; }
.links a { line-height: 1.7; }
a:focus-visible, input:focus-visible { outline: 3px solid #4fa1b3; outline-offset: 4px; }
[hidden] { display: none !important; }
@media (max-width: 620px) { main { padding: 24px 18px; } .studies { grid-template-columns: minmax(0, 1fr); } }</style></head><body><main>
<nav aria-label="Documents"><a href="main.html">Read report</a>
<a href="main.pdf">Download PDF</a>
</nav>
<header><p class="eyebrow">Report resources</p><h1>Supplementary outputs</h1>
<p>Open the interactive assessment results and supporting outputs.</p></header>
<label for="search">Find an analysis</label><input id="search" type="search" placeholder="Profile, stepwise, retrospective…">
<section class="studies" aria-label="Analyses">
<article id="supplementary-viewer"><h2>Supplementary interactive viewer</h2><div class="links"><a href="https://kyuhank.github.io/assessment-workflow-demo/artifacts/index.html">Open viewer<span aria-hidden="true"> ↗</span></a></div></article>
</section>
<p id="empty" hidden>No matching analyses.</p></main>
<script>document.getElementById("search").addEventListener("input",function(){const q=this.value.trim().toLowerCase();const cards=[...document.querySelectorAll("article")];cards.forEach(c=>c.hidden=!c.textContent.toLowerCase().includes(q));document.getElementById("empty").hidden=cards.some(c=>!c.hidden);});</script></body></html>
