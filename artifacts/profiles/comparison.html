<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Likelihood profiles</title><style>:root {
  color-scheme: light;
  --ink: #17333d;
  --muted: #65757d;
  --line: #e2e9ec;
  --accent: #187e83;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--ink);
  background: #f5f7f8;
}
* { box-sizing: border-box; }
body { margin: 0; }
button, select, input { font: inherit; }
button, select { border: 1px solid var(--line); border-radius: 8px; background: white; padding: 8px 12px; color: var(--ink); }
button { cursor: pointer; }
button:hover { background: #edf5f5; }
button:focus-visible, select:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid #4fa1b3; outline-offset: 3px; }
button[disabled] { opacity: .45; cursor: default; }
.skip { position: fixed; top: -50px; left: 16px; padding: 10px; background: white; z-index: 9; }
.skip:focus { top: 8px; }
header { height: 76px; display: flex; align-items: center; justify-content: space-between; padding: 0 36px; border-bottom: 1px solid var(--line); background: #fff; }
.brand { font-size: 22px; font-weight: 720; letter-spacing: -.7px; }
.brand span { font-weight: 400; color: var(--accent); padding-left: 6px; }
.local { font-size: 12px; color: var(--muted); }
.workspace { display: grid; grid-template-columns: 248px minmax(0, 1fr); max-width: 1600px; margin: auto; }
.profile-mode .workspace { grid-template-columns: minmax(0, 1fr); max-width: 1350px; }
.profile-mode aside { display: none; }
aside { padding: 32px 20px; border-right: 1px solid var(--line); min-height: calc(100vh - 76px); min-width: 0; }
.side-title { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 650; }
.side-title button { border: 0; color: var(--accent); background: transparent; padding-right: 0; font-size: 12px; }
#collection-kind { margin: 2px 0 22px; color: var(--muted); font-size: 12px; text-transform: capitalize; }
.model { display: grid; grid-template-columns: 20px 1fr; gap: 9px; padding: 14px 10px; margin-bottom: 10px; background: #fff; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; }
.model:has(input:checked) { border-color: #8ab8bc; box-shadow: 0 2px 8px #17333d05; }
.model input { margin: 3px 0; accent-color: var(--accent); width: 16px; height: 16px; }
.model strong { display: block; font-size: 13px; line-height: 1.5; }
.model small { display: block; color: var(--muted); font-size: 11px; line-height: 1.6; margin-top: 4px; }
.model .step { color: var(--accent); font-size: 10px; letter-spacing: 1px; }
main { padding: 38px 42px 20px; min-width: 0; }
.eyebrow { color: var(--accent); font-size: 11px; letter-spacing: 1.7px; text-transform: uppercase; font-weight: 650; }
h1 { font-size: clamp(24px, 2.5vw, 34px); letter-spacing: -.9px; font-weight: 650; margin: 12px 0 8px; line-height: 1.3; }
.intro { color: var(--muted); margin: 0 0 25px; font-size: 14px; }
.summary { display: flex; flex-wrap: wrap; gap: 20px; margin: 0 0 28px; font-size: 12px; color: var(--muted); }
.summary b { color: var(--ink); font-size: 17px; margin-right: 5px; }
nav { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
nav button { background: transparent; border-color: transparent; font-size: 13px; }
nav button[aria-pressed="true"] { background: var(--ink); color: white; }
.panel { border: 1px solid var(--line); border-radius: 16px; background: #fff; padding: 24px; box-shadow: 0 4px 24px #17333d04; }
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px; border-bottom: 1px solid #eff3f4; padding-bottom: 20px; margin-bottom: 20px; }
.toolbar select { max-width: 100%; flex: 1; min-width: 120px; }
.toolbar label { white-space: nowrap; }
h2 { font-size: 18px; font-weight: 600; letter-spacing: -.3px; margin: 0 0 8px; }
.muted { color: var(--muted); font-size: 12px; line-height: 1.6; }
#chart > svg { display: block; width: 100%; height: auto; }
.empty { padding: 80px 20px; text-align: center; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; font-size: 12px; }
.legend span::before { content: ""; display: inline-block; width: 18px; height: 3px; vertical-align: middle; background: var(--series-color); margin-right: 7px; }
.hover { min-height: 24px; text-align: center; font-size: 12px; color: var(--muted); margin: 12px 0; }
.table-wrap { overflow: auto; max-height: 430px; border-radius: 8px; }
details { min-width: 0; border-top: 1px solid var(--line); padding-top: 14px; }
summary { cursor: pointer; font-size: 12px; color: var(--accent); }
table { border-collapse: collapse; width: 100%; font-size: 12px; text-align: left; }
th { position: sticky; top: 0; background: #f1f6f7; color: var(--ink); font-weight: 600; }
th, td { padding: 10px 12px; border-bottom: 1px solid #edf1f3; white-space: nowrap; }
td { color: #50636d; }
.footnote { color: var(--muted); font-size: 11px; margin: 16px 2px; line-height: 1.7; }
footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; padding: 24px 2px 6px; font-size: 10px; color: #65757d; }
[hidden] { display: none !important; }
@media (max-width: 850px) {
  .workspace { grid-template-columns: minmax(0, 1fr); }
  aside { min-height: 0; border-right: 0; border-bottom: 1px solid var(--line); padding: 16px 20px; }
  #models { display: flex; gap: 8px; overflow-x: auto; }
  .model { min-width: 200px; margin-bottom: 0; }
  #collection-kind { margin-bottom: 10px; }
  main { padding: 26px 20px 16px; }
  header { height: 65px; padding: 0 20px; }
  .panel { padding: 16px; }
}
@media (max-width: 480px) {
  .local { display: none; }
  .toolbar { gap: 8px; }
  .toolbar select { flex-basis: 75%; }
  main { padding-left: 12px; padding-right: 12px; }
  nav { gap: 2px; }
  nav button { padding: 8px; font-size: 12px; }
}

.table-pages { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.table-pages[hidden] { display: none; }
#sample { flex: 0 1 190px; }

.fit-tabs { display:flex; flex-wrap:wrap; gap:6px; margin:-6px 0 18px; }
.fit-tabs[hidden] { display:none; }
.fit-tabs button { border:1px solid #dce5e7; border-radius:20px; padding:7px 13px; background:white; color:#536b74; cursor:pointer; }
.fit-tabs button[aria-pressed="true"] { background:#edf6f5; border-color:#87b8b7; color:#17686d; }
.profile-toolbar { display:flex; align-items:center; flex-wrap:wrap; gap:8px; font-size:12px; margin:12px 0; }
.profile-toolbar label { display:flex; align-items:center; gap:8px; }
.profile-toolbar input { flex:1; min-width:170px; border:1px solid var(--line); padding:9px; border-radius:7px; }
.profile-curves { display:flex; flex-wrap:wrap; gap:8px; max-height:180px; overflow:auto; padding:2px 0 16px; }
.profile-curve { display:flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:18px; padding:6px 10px; font-size:12px; cursor:pointer; }
.profile-tree { display: block; max-height: 32rem; overflow: auto; }
.profile-tree .profile-curve { border: 0; border-radius: 4px; padding: 4px 8px; }
.profile-branch { display: flex; align-items: center; flex-wrap: wrap; gap: .35rem; padding: .12rem 0; }
.profile-branch > .profile-curve { flex: 1; min-width: 8rem; }
.profile-detail { font-size: .75rem; padding: .2rem .55rem; white-space: nowrap; }
.profile-children { flex-basis: 100%; border-left: 1px solid #dbe5e8; padding-left: .8rem; margin-left: .4rem; }
.plot-output { min-width: 0; }
.profile-curves-visible .plot-workspace { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 24px; align-items: start; }
#profile-controls { min-width: 0; padding: 16px; border: 1px solid var(--line); border-radius: 10px; background: #f8fafb; }
.profile-heading { font-size: 14px; margin: 0 0 6px; }
.profile-hint { font-size: 12px; color: var(--muted); line-height: 1.5; margin: 0; }
.profile-toolbar input { width: 100%; flex-basis: 100%; }
.profile-tree .profile-curve { min-width: 0; overflow-wrap: anywhere; }
.profile-branch:has(> .profile-curve input:checked) > .profile-curve { color: var(--accent); }
@media (max-width: 1050px) {
  .profile-curves-visible .plot-workspace { grid-template-columns: minmax(0, 1fr); }
  .profile-tree { max-height: 18rem; }
}
#band-controls:not([hidden]) { display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
#band-controls label { display:inline-flex; align-items:center; gap:5px; }</style><style>:root{--accent:#187e83}.view-masthead{display:flex;align-items:center;justify-content:space-between;gap:1rem;width:100%}.view-masthead .brand{font:650 21px/1.2 system-ui,sans-serif;letter-spacing:-.5px}.view-masthead .brand span{color:var(--accent);font-weight:400;padding-left:.4rem}.view-developer{text-align:right;font:12px/1.4 system-ui,sans-serif;color:#435a65}.view-developer span{display:block;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#6a7d86}.view-developer strong{font-weight:550}.view-developer a{display:block;font-size:10px;line-height:1.6;color:#637984;text-decoration:none}.view-developer a:hover,.view-developer a:focus-visible{color:var(--accent);text-decoration:underline}@media(max-width:420px){.view-masthead .brand{font-size:19px}.view-developer{font-size:11px}}</style></head><body>

<script>(() => {/* Profile-specific selection uses the same portable rows as publication plots.
 * Recentring changes only display values, never raw objectives or fit eligibility.
 */
function createProfileControls(root, node, redraw) {
  const states = new Map();
  function prepare(view, rows) {
    const active = view?.family === "profile";
    root.hidden = !active;
    if (!active) return {rows, note: ""};
    const allRows = view.profileRows;
    const curves = [...new Map(allRows.map(row => [row.curve_id, row.curve_label])).entries()];
    const representatives = [...new Map(allRows.map(row => [row.curve_id, row])).values()];
    const roots = representatives.filter(row => !row.parent_component_id);
    if (!states.has(view.id)) states.set(view.id, {
      selected: new Set(view.hierarchy ? roots.map(row => row.curve_id) : curves.map(([id]) => id)),
      open: new Set(), query: ""
    });
    const state = states.get(view.id);
    root.replaceChildren();
    root.append(node("h3", "Components", "profile-heading"),
      node("p", "Show contributions, then open details by region or series.", "profile-hint"));
    const tools = node("div", undefined, "profile-toolbar");
    const search = node("input"); search.id = "profile-search"; search.type = "search";
    search.placeholder = "Find a component or series"; search.setAttribute("aria-label", search.placeholder);
    search.value = state.query;
    // Filtering changes controls only, so typing does not recreate its own input.
    search.addEventListener("input", () => {
      state.query = search.value;
      filterProfileControls(root, state.query);
    });
    tools.append(search);
    for (const [text, checked] of [["Show all", true], ["Overview", false]]) {
      const button = node("button", text); button.type = "button";
      button.addEventListener("click", () => {
        state.selected = new Set(checked || !view.hierarchy ? curves.map(([id]) => id) : []);
        if (!checked) state.query = "";
        if (view.hierarchy) {
          state.open = new Set(checked ? representatives.filter(row => representatives.some(
            child => child.parent_component_id === row.component_id)).map(row => row.component_id) : []);
          roots.forEach(row => state.selected.add(row.curve_id));
        }
        redraw();
      }); tools.append(button);
    }
    root.append(tools);
    const list = node("div", undefined, "profile-curves");
    if (view.hierarchy) appendProfileTree(list, representatives, state, node, redraw);
    else {
    for (const [id, text] of curves) {
      const item = node("label", undefined, "profile-curve"), input = node("input");
      input.type = "checkbox"; input.value = id; input.checked = state.selected.has(id);
      input.addEventListener("change", () => {
        if (input.checked) state.selected.add(id); else state.selected.delete(id);
        redraw();
      });
      item.append(input, document.createTextNode(text));
      item.hidden = !text.toLowerCase().includes(state.query.toLowerCase());
      list.append(item);
    }
    }
    root.append(list);
    filterProfileControls(root, state.query);
    const minimum = new Map();
    // Keep the whole accepted grid as baseline when model/point selection changes.
    for (const row of allRows) if (Number.isFinite(row.objective))
      minimum.set(row.curve_id, Math.min(minimum.get(row.curve_id) ?? Infinity, row.objective));
    rows = rows.filter(row => state.selected.has(row.curve_id)).map(row => {
      const baseline = minimum.get(row.curve_id);
      const value = Number.isFinite(row.objective) && Number.isFinite(baseline) ? row.objective - baseline : null;
      return {...row, value, objective_difference: value, profile_center: "minimum",
        reference_line: (row.threshold_center || "minimum") === "minimum" ? row.threshold : null};
    });
    if (view.hierarchy) {
      const visible = rows.filter(row => !row.parent_component_id).map(row => ({...row, facet: "Components"}));
      for (const parent of representatives) if (state.open.has(parent.component_id)) {
        let ancestor = parent.parent_component_id, shown = true;
        while (ancestor) {
          if (!state.open.has(ancestor)) { shown = false; break; }
          ancestor = representatives.find(row => row.component_id === ancestor)?.parent_component_id;
        }
        if (!shown) continue;
        const path = [parent.curve_label]; ancestor = parent.parent_component_id;
        while (ancestor) {
          const row = representatives.find(row => row.component_id === ancestor);
          if (!row) break;
          path.unshift(row.curve_label); ancestor = row.parent_component_id;
        }
        const facet = path.join(" / ");
        // Each detail panel retains its own parent total even when children are hidden.
        for (const row of allRows.filter(row => row.component_id === parent.component_id)) {
          const baseline = minimum.get(row.curve_id);
          const value = Number.isFinite(row.objective) && Number.isFinite(baseline) ? row.objective - baseline : null;
          if (view.selectedModels.has(row.model)) visible.push({...row, value, objective_difference: value,
            profile_center: "minimum", facet, profile_total: true});

        visible.push(...rows.filter(row => row.parent_component_id === parent.component_id).map(row => ({...row, facet})));
      }
      rows = visible;
    }
    const rejected = new Set(allRows.filter(row => !Number.isFinite(row.objective))
      .map(row => JSON.stringify([row.model, row.x]))).size;
    const note = "Each curve is centered on its own accepted grid minimum." +
      (rejected ? ` ${rejected} excluded profile point${rejected === 1 ? "" : "s"}; original values remain in the data.` : "");
    return {rows, note};
  }
  return {prepare};
}

// A matching child keeps its ancestry visible; unrelated branches disappear.
function filterProfileControls(root, query) {
  const text = query.toLowerCase().trim();
  for (const branch of [...root.querySelectorAll(".profile-branch")].reverse()) {
    const item = branch.querySelector(":scope > .profile-curve");
    const children = branch.querySelector(":scope > .profile-children");
    const matches = item.textContent.toLowerCase().includes(text);
    const childMatch = children && [...children.children].some(child => !child.hidden);
    branch.hidden = !!text && !matches && !childMatch;
    item.hidden = false;
    if (children) children.hidden = text ? !childMatch :
      branch.querySelector(":scope > .profile-detail").getAttribute("aria-expanded") !== "true";
  }
  for (const item of root.querySelectorAll(".profile-curves:not(.profile-tree) > .profile-curve"))
    item.hidden = !item.textContent.toLowerCase().includes(text);
}

function appendProfileTree(root, rows, state, node, redraw) {
  root.classList.add("profile-tree");
  function append(parent, children) {
    for (const row of children) {
      const branch = node("div", undefined, "profile-branch");
      const item = node("label", undefined, "profile-curve"), input = node("input");
      input.type = "checkbox"; input.value = row.curve_id; input.checked = state.selected.has(row.curve_id);
      input.disabled = row.component === "Total";
      input.addEventListener("change", () => {
        if (input.checked) state.selected.add(row.curve_id); else state.selected.delete(row.curve_id);
        redraw();
      });
      item.append(input, document.createTextNode(row.curve_label)); branch.append(item);
      item.hidden = !row.curve_label.toLowerCase().includes(state.query.toLowerCase());
      const descendants = rows.filter(child => row.component_id && child.parent_component_id === row.component_id);
      if (descendants.length) {
        const open = state.open.has(row.component_id);
        const button = node("button", open ? "Hide details" : "Details"); button.type = "button";
        button.className = "profile-detail"; button.dataset.profileDetail = row.component_id;
        button.setAttribute("aria-label", `${open ? "Hide" : "Show"} ${row.curve_label} details`);
        button.setAttribute("aria-expanded", String(open));
        button.addEventListener("click", () => {
          if (open) state.open.delete(row.component_id); else {
            state.open.add(row.component_id); descendants.forEach(child => state.selected.add(child.curve_id));
          }
          redraw();
        }); branch.append(button);
        const nested = node("div", undefined, "profile-children"); nested.hidden = !open && !state.query;
        append(nested, descendants); branch.append(nested);

      parent.append(branch);
    }
  }
  append(root, rows.filter(row => !row.parent_component_id));
}
/* Equal-weight pointwise quantiles, matching R quantile(type = 7). */
function summarizeTrajectoryBands(rows, probabilities, members, minModels = 2) {
  const groups = new Map();
  for (const row of rows) {
    const key = JSON.stringify([row.metric, row.group, row.unit, row.time]);
    if (!groups.has(key)) groups.set(key, {row, values: []});
    if (members.has(row.model) && Number.isFinite(row.value)) groups.get(key).values.push(row.value);
  }
  const out = [];
  for (const {row, values} of groups.values()) {
    values.sort((a,b) => a-b);
    const quantile = p => {
      if (values.length < minModels) return null;
      const h = (values.length - 1) * p, lo = Math.floor(h), fraction = h-lo;
      return values[lo] + fraction * (values[Math.min(lo+1, values.length-1)] - values[lo]);
    };
    for (const probability of probabilities) out.push({metric: row.metric, group: row.group,
      unit: row.unit, time: row.time, probability, lower: quantile((1-probability)/2),
      median: quantile(.5), upper: quantile((1+probability)/2), n: values.length});
  }
  return out.sort((a,b) => a.time-b.time || b.probability-a.probability);
}

function createBandControls(root, node, data, refresh, download) {

    const points = bands.filter(r => r.probability === probability).sort((a,b) => a.time-b.time);

        if (medianOnly) el("path", {d: run.map((r,i) => `${i ? "L" : "M"}${px(r.time)},${py(r.median)}`).join(" "),
          fill:"none", stroke:"#164f5e", "stroke-width":1.5, "data-run-median":"true"});
        else el("polygon", {points:[...run.map(r => `${px(r.time)},${py(r.lower)}`),
          ...run.slice().reverse().map(r => `${px(r.time)},${py(r.upper)}`)].join(" "),
          fill:"#338da0", "fill-opacity":.14, stroke:"none", "data-run-band":probability});
      }

  function compositionOverview() {

  function compositionPanels(rows) {
    const key = row => JSON.stringify([row.model, row.axis, row.series, row.bin_unit, row.condition_bin]);

    for (const row of data.composition_summaries.select({model: selected, axis: scope})) {

    const samples = new Map(), result = new Map();
    for (const row of rows) {
      const id = key(row);

      const sample = JSON.stringify([id, row.time, row.record]);
      if (!samples.has(sample)) { samples.set(sample, []); result.set(sample, samples.get(sample)); }
      samples.get(sample).push(row);

    const combined = new Map();

      if (!combined.has(id)) combined.set(id, []);

  }

  // Split by series before drawing: never connect different fisheries or

  function drawPanels(rows) {

        overview ? JSON.stringify([row.series, row.model, row.bin_unit]) : tab === "reports" && row.facet ? row.facet : "all";
      if (!split.has(key)) split.set(key, []);

      width >= 1000 && (tab === "fits" || overview) ? 3 : width >= 740 ? 2 : 1);
    const gap = 16, panelWidth = (width - gap * (columns - 1)) / columns;
    const compatible = tab === "series" && !population && unique(rows.map(r => JSON.stringify([r.unit, r.axis_label || ""]))).length === 1;
    const seriesSource = data.annual && byId("resolution").value === "annual" ? data.annual.series : data.series;
    const xRange = tab === "series" ? extent(seriesSource.select({metric: population ? new Set(overviewMetrics) : rows[0].metric}).map(r => r.time).filter(Number.isFinite)) :
      tab === "fits" ? extent((data.annual && byId("resolution").value === "annual" ? data.annual.fits : data.fits).select({kind: scope}).map(r => r.time).filter(Number.isFinite)) : null;
    const charts = panels.map(part => {

        (overview && !row.pooled ? ` · ${String(row.time)}` + (row.record != null && String(row.record).length ? ` · ${row.record}` : "") : "");
      const axisRows = population ? rows.filter(r => r.metric === row.metric && r.unit === row.unit && (r.axis_label || "") === (row.axis_label || "")) : compatible ? rows : part;

  function draw(rows, options = {}) {

    const yname = ["series", "curves", "reports"].includes(tab) ? "value" : residual ? "residual" : "predicted";
    const observations = ["fits", "compositions"].includes(tab) && !residual;

    const exponent = scalable ? (magnitude >= 1e6 ? 6 : magnitude >= 1e4 ? 3 : 0) : 0;

    const width = options.width || Math.max(320, Math.min(900, byId("chart").clientWidth || 900));
    let height = options.compact ? 240 : options.label ? 320 : 390;
    let left = options.compact ? 70 : 90, right = 25;
    const bottom = 55;

      if (tab !== "reports") return color(id);

      if (supplied) return supplied;

    };
    const legendModels = options.legend === false || (tab === "compositions" && lineModels.length === 1) ? [] : lineModels.filter(m => rows.some(r => lineId(r) === m.id));
    const legendPositions = [];

    const binEdges = new Map();

    const xMagnitude = Math.max(Math.abs(xmin), Math.abs(xmax));
    const xScalable = tab === "reports" && ["t", "kg", "fish", "number", "model biomass units", "model abundance units"].includes(rows[0].x_unit);
    const xExponent = xScalable ? (xMagnitude >= 1e6 ? 6 : xMagnitude >= 1e4 ? 3 : 0) : 0;

      r.group === rows[0].group && r.unit === rows[0].unit) : [];
    drawTrajectoryBand(bands, el, px, py);
    const indexObservations = observations && tab === "fits" && rows[0].kind === "index" && !hindcast;
    if (indexObservations) {
      // One translucent layer keeps coincident observations light. Draw all
      // observations before any prediction so model order cannot obscure a fit.
      const layer = el("g", {"data-layer": "index-observations", opacity: .6});
      for (const p of rows.filter(p => Number.isFinite(p.observed))) {
        const key = JSON.stringify([p[xname], p.observed]);
        if (observedKeys.has(key)) continue;
        observedKeys.add(key);
        layer.append(el("circle", {cx: px(p[xname]), cy: py(p.observed),
          r: options.compact ? 2 : 2.4, fill: "white", stroke: "#65757d",
          "stroke-width": .8, "data-observed": p.observed}));
      }
    }
    for (const model of lineModels) {
      const points = rows.filter(r => lineId(r) === model.id).sort((a, b) => a[xname] - b[xname]);
      if (!points.length) continue;
      if (indexObservations) {
        let run = [];
        const flush = () => {
          if (run.length > 1) el("polygon", {points: [...run.map(p => `${px(p[xname])},${py(p.observation_lower)}`),
            ...[...run].reverse().map(p => `${px(p[xname])},${py(p.observation_upper)}`)].join(" "),
            fill: lineColor(model.id), "fill-opacity": .12, stroke: "none", "data-observation-interval": "true"});
          run = [];
        };
        for (const p of points) {
          if (Number.isFinite(p.observation_lower) && Number.isFinite(p.observation_upper)) run.push(p); else flush();
        }
        flush();
      }
      if (tab === "reports" && points.some(p => Number.isFinite(p.lower) && Number.isFinite(p.upper))) {
        for (const probability of unique(points.map(p => p.probability))) {
          const band = points.filter(p => p.probability === probability);
          let run = [];
          const flush = () => {
            if (run.length > 1) el("polygon", {points: [...run.map(p => `${px(p[xname])},${py(p.lower)}`),
              ...[...run].reverse().map(p => `${px(p[xname])},${py(p.upper)}`)].join(" "),
              fill: lineColor(model.id), "fill-opacity": .13, stroke: "none"});
            run = [];
          };
          for (const p of band) {
            if (Number.isFinite(p.lower) && Number.isFinite(p.upper)) run.push(p); else flush();
          }
          flush();
        }
      }
      if (tab === "compositions") for (const p of points.filter(p => Number.isFinite(p.observed))) {
        const observedKey = JSON.stringify([p.bin, p.observed]);
        if (observedKeys.has(observedKey)) continue;
        observedKeys.add(observedKey);
        const edge = binEdges.get(p.bin);
        el("rect", {x: px(edge[0]), y: py(p.observed), width: Math.max(0, px(edge[1]) - px(edge[0])),
          height: Math.max(0, py(0) - py(p.observed)), fill: "#a9cdd0", stroke: "white", "stroke-width": .5,
          "data-observed": p.observed, "data-bin": p.bin, "fill-opacity": lineModels.length > 1 ? .55 : 1});
      }
      let path = "", segment = false;
      if (tab === "compositions" && points.every(p => Number.isFinite(p.lower) && Number.isFinite(p.upper)))
        el("polygon", {points: [...points.map(p => `${px(p.bin)},${py(p.lower)}`),
          ...[...points].reverse().map(p => `${px(p.bin)},${py(p.upper)}`)].join(" "),
          fill: "#756294", "fill-opacity": .2, stroke: "none", "data-composition-interval": "true"});
      for (const p of points) {
        if (!Number.isFinite(p[yname])) { segment = false; continue; }
        path += `${segment ? "L" : "M"}${px(p[xname])},${py(p[yname])} `;
        segment = true;
        const profilePoint = tab === "reports" && sourceView?.family === "profile";
        if (residual || hindcast || profilePoint || p.geometry?.includes("points") || points.length === 1 || rows[0].metric === "MASE") el("circle", {
          cx: px(p[xname]), cy: py(p[yname]), r: profilePoint ? 2.2 : 3,
          fill: hindcast ? "white" : lineColor(model.id), stroke: lineColor(model.id),
          ...(profilePoint ? {"data-profile-point": p[xname], "data-profile-value": p[yname]} : {})});
      }
      if (!residual && points[0].geometry !== "points" && !(bands.length && model.id === data.reference)) el("path", {d: path, fill: "none", stroke: tab === "compositions" && lineModels.length === 1 ? "#756294" : lineColor(model.id),
        "stroke-width": bands.length ? .7 : tab === "series" && ["jitter", "selftest", "ensemble"].includes(data.type) ? 1 : 2.5,
        "stroke-opacity": bands.length && model.id !== data.reference ? .45 : 1,
        "data-model": points[0].model, "data-predicted": tab === "compositions" ? "true" : "false",
        "stroke-dasharray": lineDash(model.id), "stroke-linejoin": "round"});
      if (data.type === "retrospective" && tab === "series") {
        const end = points[points.length - 1];
        if (Number.isFinite(end[yname])) el("circle", {cx: px(end[xname]), cy: py(end[yname]), r: 4, fill: lineColor(model.id)});
      }
      if (observations && tab !== "compositions" && !hindcast && !indexObservations) points.filter(p => Number.isFinite(p.observed)).forEach(p => {
        const key = JSON.stringify([p[xname], p.observed]);
        if (observedKeys.has(key)) return;
        observedKeys.add(key);
        el("circle", {cx: px(p[xname]), cy: py(p.observed), r: 3, fill: "white", stroke: "#374b54", "stroke-width": 1.3, "data-observed": p.observed});
      });
    }
    drawTrajectoryBand(bands, el, px, py, true);
    if (bands.length) {
      const reference = rows.filter(r => r.model === data.reference).sort((a,b) => a.time-b.time);
      let path = "", segment = false;
      for (const r of reference) {
        if (!Number.isFinite(r.value)) { segment = false; continue; }
        path += `${segment ? "L" : "M"}${px(r.time)},${py(r.value)} `; segment = true;
      }
      el("path", {d:path, fill:"none", stroke:"#b43e36", "stroke-width":1.2,
        "stroke-dasharray":"6 3", "data-band-reference":"true", "data-model":data.reference});
    }
    for (const item of legendPositions) {
      const row = rows.find(r => lineId(r) === item.model.id);
      if (row?.geometry !== "points") el("line", {x1: item.x, x2: item.x + 19, y1: item.y - 4, y2: item.y - 4, stroke: lineColor(item.model.id), "stroke-width": 2.5, "stroke-dasharray": lineDash(item.model.id)});
      if (row?.geometry?.includes("points")) el("circle", {cx: item.x + 9, cy: item.y - 4, r: 3, fill: lineColor(item.model.id)});
      text(item.x + 26, item.y, item.model.label, "start");
    }
    if (tab === "compositions" && rows[0].pooled) {
      svg.setAttribute("data-samples", rows[0].n_samples);
      svg.setAttribute("data-unit", rows[0].unit);
    }
    const cursor = el("line", {x1: 0, x2: 0, y1: top, y2: height - bottom, stroke: "#93a6af", visibility: "hidden"});
    svg.addEventListener("pointermove", event => {
      const rect = svg.getBoundingClientRect();
      const x = (event.clientX - rect.left) / rect.width * width;
      const target = xmin + (x - left) / (width - left - right) * (xmax - xmin);
      const nearest = rows.reduce((a, b) => Math.abs(a[xname] - target) < Math.abs(b[xname] - target) ? a : b)[xname];
      cursor.setAttribute("x1", px(nearest)); cursor.setAttribute("x2", px(nearest)); cursor.setAttribute("visibility", "visible");
      byId("hover").textContent = `${format(nearest)} · ` + rows.filter(r => r[xname] === nearest)
        .map(r => `${r.label}: ${format(r[yname])}${observations ? ` (observed ${format(r.observed)})` : ""}`).join(" · ");
    });
    svg.addEventListener("pointerleave", () => cursor.setAttribute("visibility", "hidden"));
    byId("chart").append(svg);
    return svg;
  }

  function download(content, type, filename) {
    const url = URL.createObjectURL(new Blob([content], {type}));
    const link = node("a"); link.href = url; link.download = filename; link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  byId("download-csv").addEventListener("click", () => {
    const quote = value => '"' + String(value == null ? "" : value).replaceAll('"', '""') + '"';
    const csv = [currentColumns.map(quote).join(","), ...currentRows.map(row =>
      currentColumns.map(c => quote(row[c])).join(","))].join("\r\n");
    download(csv, "text/csv;charset=utf-8", `${tab}-data.csv`);
  });
  byId("download-svg").addEventListener("click", () => {
    const svg = byId("chart").querySelector("svg");
    if (svg) download(new XMLSerializer().serializeToString(svg), "image/svg+xml", `${tab}-comparison.svg`);
  });
  let resize;
  window.addEventListener("resize", () => { clearTimeout(resize); resize = setTimeout(render, 100); });
  function openRequestedTab() {
    const hash = location.hash.slice(1);
    const alias = ["overview", "depletion"].includes(hash);
    const requested = hash ? tabs.find(view => tabId(view) === (alias ? "series" : hash)) : tabs[0];
    if (alias) {
      const i = choices.series.findIndex(c => hash === "overview" ? c.key[0] === allSeries : isDepletion(c.key[0]));
      if (i >= 0) savedChoice.series = String(i);
    }
    if (requested) { tab = requested.type; scope = requested.scope || null; activeTab = tabId(requested); }
    controls(); render();
  }
  window.addEventListener("hashchange", openRequestedTab);
  openRequestedTab();
})();
})();</script></body></html>
