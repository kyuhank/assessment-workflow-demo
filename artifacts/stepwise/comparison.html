<script>/* Offline viewer: data selection is separate from SVG drawing and downloads. */
"use strict";
(() => {
  const data = JSON.parse(document.getElementById("result-data").textContent);
  // Older row-based payloads and new compact column payloads share the same view.
  const unpack = table => {
    if (!table || table.encoding !== "columns-v1") return table;
    const columns = table.columns.map(column => column.index ?
      column.index.map(i => column.dictionary[i]) : column.values);
    return Array.from({length: table.n}, (_, i) =>
      Object.fromEntries(table.names.map((name, j) => [name, columns[j][i]])));
  };
  // Keep large records columnar. Only the selected model/series/sample becomes
  // row objects; opening a table does not expand every other custom table.
  class RowStore {
    constructor(table) {
      this.packed = table?.encoding === "columns-v1";
      this.source = table || [];
      this.length = this.packed ? table.n : this.source.length;
      this.names = this.packed ? table.names : (this.source[0] ? Object.keys(this.source[0]) : []);
      this.positions = new Map(this.names.map((name, i) => [name, i]));
    }
    value(i, name) {
      if (!this.packed) return this.source[i][name];
      const position = this.positions.get(name);
      if (position === undefined) return undefined;
      const column = this.source.columns[position];
      return column.index ? column.dictionary[column.index[i]] : column.values[i];
    }
    row(i) { return this.packed ? Object.fromEntries(this.names.map(name => [name, this.value(i, name)])) : this.source[i]; }
    select(conditions) {
      const matches = Object.entries(conditions);
      const rows = [];
      for (let i = 0; i < this.length; i++) {
        if (matches.every(([name, expected]) => {
          const value = this.value(i, name);
          return expected instanceof Set ? expected.has(value) : typeof expected === "function" ? expected(value) : value === expected;
        })) rows.push(this.row(i));
      }
      return rows;
    }
    representatives(columns, conditions = {}) {
      const found = new Map();
      const filters = Object.entries(conditions);
      for (let i = 0; i < this.length; i++) {
        if (!filters.every(([name, value]) => this.value(i, name) === value)) continue;
        const key = JSON.stringify(columns.map(name => this.value(i, name)));
        if (!found.has(key)) found.set(key, this.row(i));
      }
      return [...found].map(([key, row]) => ({key: JSON.parse(key), row}));
    }
    unique(name) {
      const values = new Set();
      for (let i = 0; i < this.length; i++) values.add(this.value(i, name));
      return [...values];
    }
  }
  for (const name of ["changes", "checks", "status"]) data[name] = unpack(data[name]);
  for (const name of ["series", "fits", "compositions", "composition_summaries"]) data[name] = new RowStore(data[name]);
  if (data.annual) for (const name of ["series", "fits"]) data.annual[name] = new RowStore(data.annual[name]);
  data.views = data.views || [];
  const hindcastHistory = data.type === "hindcast" ?
    unpack(data.tables.find(t => t.name === "hindcast_observations")?.rows) || [] : [];
  data.curves = new RowStore(data.tables.filter(t => t.name === "curves").flatMap(t =>
    unpack(t.rows).map(r => ({...r, model: t.model, label: t.label}))));
  const byId = id => document.getElementById(id);
  const node = (tag, text, className) => {
    const el = document.createElement(tag);
    if (text !== undefined) el.textContent = text;
    if (className) el.className = className;
    return el;
  };
  const palettes = ["#187e83", "#cf7953", "#7666a5", "#5273aa", "#749753", "#b35e81"];
  const color = id => palettes[data.models.findIndex(m => m.id === id) % palettes.length];
  const selected = new Set(data.models.slice(0, 6).map(m => m.id));
  const format = value => typeof value === "number" ?
    value.toLocaleString("en", {maximumSignificantDigits: 5}) : value == null ? "" : String(value);
  const pretty = value => { const text = value.replaceAll("_", " "); return text.charAt(0).toUpperCase() + text.slice(1); };
  const extent = values => values.reduce(([lo, hi], x) => [Math.min(lo, x), Math.max(hi, x)], [Infinity, -Infinity]);
  const ticks = (lo, hi, integer = false) => {
    const raw = (hi - lo) / 5;
    const power = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = Math.max(integer ? 1 : 0, [1, 2, 5, 10].find(n => n * power >= raw) * power);
    const values = [];
    for (let x = Math.ceil(lo / step) * step; x <= hi + step * 1e-9; x += step) values.push(x);
    return values;

    `${row.display_name || pretty(row.metric)}${row.unit && row.unit !== "ratio" ? ` (${row.unit})` : ""}`);

    const parts = value.replaceAll("SB_F0", "SB[F=0]").split(/(SB0|\[[^\]]+\]|\^-?\d+|per year)/g);

      const sub = part === "SB0" || part.startsWith("[");

      if (!sub && !sup) { element.append(document.createTextNode(part)); continue; }

      if (part === "per year") element.append(document.createTextNode("year"));
      const span = svg ? document.createElementNS("http://www.w3.org/2000/svg", "tspan") : node(sub ? "sub" : "sup");
      span.textContent = part === "SB0" ? "0" : part === "per year" ? "−1" : sub ? part.slice(1, -1) : part.slice(1);

      element.append(span);
    }
  }

  const allSeries = "__all__";
  const isDepletion = metric => /(^|_)depletion($|_)/.test(metric);
  let savedGroup = "";

  let currentRows = [];
  let currentColumns = [];
  byId("title").textContent = data.title;
  byId("eyebrow").textContent = `${data.type} / ${data.models.length} model${data.models.length === 1 ? "" : "s"}`;
  byId("collection-kind").textContent = `${data.type} · in supplied order`;

  for (const [i, model] of data.models.entries()) {
    const change = data.changes.find(c => c.id === model.id);
    const label = node("label", undefined, "model");
    const input = node("input");
    input.type = "checkbox";
    input.value = model.id;
    input.checked = selected.has(model.id);
    input.setAttribute("aria-label", model.label);
    input.addEventListener("change", () => {
      input.checked ? selected.add(model.id) : selected.delete(model.id);
      render();
    });
    const body = node("div");
    body.append(node("span", String(i + 1).padStart(2, "0") +
      (model.id === data.reference ? " / REFERENCE" : ""), "step"));
    body.append(node("strong", model.label));
    if (change.change && change.change !== "No change description supplied") body.append(node("small", change.change));
    if (change.parent) {
      const parent = data.models.find(m => m.id === change.parent);
      body.append(node("small", `From ${parent.label}`));
    }
    label.append(input, body);
    byId("models").append(label);
  }
  byId("toggle-all").addEventListener("click", () => {
    const clear = selected.size > 0;
    selected.clear();
    if (!clear) data.models.forEach(m => selected.add(m.id));
    document.querySelectorAll(".model input").forEach(el => { el.checked = selected.has(el.value); });
    render();
  });

  const fitNames = {index: "Index fits", catch: "Catch fits", tag: "Tag recaptures", effort: "Effort fits"};
  const axisNames = {length: "Length compositions", weight: "Weight compositions", age: "Age compositions", conditional_age: "Age at length"};
  const tabs = [
    ...(data.series.unique("metric").some(isDepletion) ? [{type: "series", scope: "depletion", id: "depletion", title: "Depletion"}] : []),
    ...(data.series.length ? [{type: "series", title: "Trajectories"}] : []),
    ...(data.curves.length ? [{type: "curves", title: "Biology and model curves"}] : []),
    ...data.fits.unique("kind").map(kind => ({type: "fits", scope: kind, title: fitNames[kind] || `${pretty(kind)} fits`})),
    ...data.compositions.unique("axis").map(axis => ({type: "compositions", scope: axis, title: axisNames[axis] || `${pretty(axis)} compositions`})),
    ...(data.views.length ? [{type: "reports", title: "Study plots"}] : []),
    {type: "checks", title: "Checks"}, ...(data.tables.length ? [{type: "tables", title: "Tables"}] : [])
  ];
  const tabId = view => view.id || view.type + (view.scope ? `-${view.scope}` : "");
  tab = tabs[0].type; scope = tabs[0].scope || null; activeTab = tabId(tabs[0]);
  for (const view of tabs) {
    const id = tabId(view);
    const button = node("button", view.title);
    button.type = "button"; button.dataset.tab = id;
    button.addEventListener("click", () => {
      tab = view.type; scope = view.scope || null; activeTab = id; tablePage = 0; controls(); render();
      history.replaceState(null, "", `#${id}`);
    });
    byId("tabs").append(button);
  }
  const seriesChoices = source => source.representatives(["metric", "group"])
    .map(({key, row}) => ({key, label: `${row.display_name || pretty(key[0])} / ${pretty(key[1])}`}));
  choices.series = data.series.representatives(["metric"])
    .map(({key, row}) => ({key, label: row.display_name || pretty(key[0])}));
  choices.curves = seriesChoices(data.curves);
  choices.fits = data.fits.representatives(["kind", "series"])
    .map(({key, row}) => ({key, label: row.series_label || pretty(key[1])}));
  choices.compositions = data.compositions.representatives(["axis", "series"])
    .map(({key, row}) => ({key, label: row.series_label || pretty(key[1])}));
  choices.reports = data.views.map((view, i) => ({key: [i], label: pretty(view.label)}));
  choices.checks = [{key: [], label: "All recorded numerical checks"}];
  choices.tables = data.tables.map((t, i) => ({key: [i], label: `${t.label} / ${pretty(t.name)}`}));
  byId("quantity").addEventListener("change", () => { savedChoice[activeTab] = byId("quantity").value; tablePage = 0; groups(); samples(); render(); });
  byId("group").addEventListener("change", () => { savedGroup = byId("group").value; tablePage = 0; render(); });
  byId("sample").addEventListener("change", () => { tablePage = 0; samplePage = 0; render(); });
  byId("previous-samples").addEventListener("click", () => { samplePage--; render(); });
  byId("next-samples").addEventListener("click", () => { samplePage++; render(); });
  byId("previous-page").addEventListener("click", () => { tablePage--; table(currentRows); });
  byId("next-page").addEventListener("click", () => { tablePage++; table(currentRows); });
  byId("residual").addEventListener("change", render);
  byId("resolution").addEventListener("change", () => { tablePage = 0; render(); });

  function controls() {
    byId("quantity").replaceChildren();
    if (["fits", "compositions"].includes(tab)) {
      const option = node("option", tab === "fits" && scope === "index" ? "All indices" : "All fisheries / groups");
      option.value = allSeries; byId("quantity").append(option);
    }
    choices[tab].forEach((choice, i) => {
      if (scope && !(tab === "series" && scope === "depletion" ? isDepletion(choice.key[0]) : choice.key[0] === scope)) return;
      const option = node("option", choice.label);
      option.value = String(i);
      byId("quantity").append(option);
    });
    const saved = savedChoice[activeTab];
    byId("quantity").value = [...byId("quantity").options].some(o => o.value === saved) ? saved : byId("quantity").options[0]?.value || "";
    byId("select-label").textContent = tab === "fits" ? (scope === "index" ? "Index" : "Fishery / group") : tab === "compositions" ? "Fishery / group" : tab === "tables" ? "Table" : "Quantity";
    groups(); samples();
    const timing = !!data.annual && ["series", "fits"].includes(tab);
    byId("resolution").hidden = !timing; byId("resolution-label").hidden = !timing;
    byId("residual-label").hidden = tab !== "fits";
    document.querySelectorAll("#tabs button").forEach(button => {
      button.setAttribute("aria-pressed", String(button.dataset.tab === activeTab));
    });
  }

  const groupLabel = row => row.group_label || (row.group === "all" ? "Overall" : pretty(row.group));
  function groups() {
    byId("group").replaceChildren();
    const choice = choices.series[Number(byId("quantity").value)];
    const available = tab === "series" && choice ?
      data.series.representatives(["group"], {metric: choice.key[0]}).map(({row}) => row) : [];
    const multiple = available.length > 1;
    byId("group").hidden = !multiple; byId("group-label").hidden = !multiple;
    if (multiple) {
      const option = node("option", "All groups"); option.value = ""; byId("group").append(option);
    }
    for (const row of available) {
      const option = node("option", groupLabel(row)); option.value = JSON.stringify(row.group); byId("group").append(option);
    }
    if (multiple && [...byId("group").options].some(o => o.value === savedGroup)) byId("group").value = savedGroup;
  }

  let samplePage = 0;
  function samples() {
    samplePage = 0;
    const show = tab === "compositions" && byId("quantity").value !== allSeries;
    byId("sample").hidden = !show; byId("sample-label").hidden = !show;
    byId("sample").replaceChildren();
    if (!show) return;
    const choice = choices.compositions[Number(byId("quantity").value)];
    if (!choice) return;
    const all = node("option", "All years / samples"); all.value = allSeries; byId("sample").append(all);
    const rows = data.compositions.representatives(["time", "record"], {axis: choice.key[0], series: choice.key[1]}).map(({row}) => row);
    const keys = unique(rows.map(r => JSON.stringify([r.time, r.record == null ? null : String(r.record)])))
      .sort((a, b) => JSON.parse(a)[0] - JSON.parse(b)[0]);
    const timeCounts = new Map();
    for (const key of keys) { const time = JSON.parse(key)[0]; timeCounts.set(time, (timeCounts.get(time) || 0) + 1); }
    const sampleRows = new Map(rows.map(r => [JSON.stringify([r.time, r.record == null ? null : String(r.record)]), r]));
    for (const key of keys) {
      const [time, record] = JSON.parse(key);
      const repeated = timeCounts.get(time) > 1;
      const row = sampleRows.get(key);
      const condition = row?.condition_bin != null ? ` · length ${row.condition_bin} ${row.condition_unit || ""}` : (repeated ? ` · sample ${record}` : "");
      const option = node("option", String(time) + condition);
      option.value = key; byId("sample").append(option);
    }
    byId("sample").value = allSeries;
  }

  function render() {
    byId("toggle-all").textContent = selected.size ? "Clear" : "Select all";
    byId("summary").replaceChildren();
    const statuses = data.status.filter(s => selected.has(s.model));
    for (const [count, label] of [[selected.size, "selected"],
      [statuses.filter(s => s.status === "passed").length, "checks passed"],
      [statuses.filter(s => s.status === "failed").length, "checks failed"],
      [statuses.filter(s => s.status === "unknown").length, "unchecked"]]) {
      const item = node("span"); item.append(node("b", String(count)), document.createTextNode(label));
      byId("summary").append(item);
    }
    const choice = choices[tab][Number(byId("quantity").value)];
    const key = choice ? choice.key : [];
    let rows = [];
    if (tab === "series") {
      const conditions = {model: selected, metric: key[0]};
      if (byId("group").value) conditions.group = JSON.parse(byId("group").value);
      rows = (data.annual && byId("resolution").value === "annual" ? data.annual.series : data.series).select(conditions);
    }
    if (tab === "curves") rows = data.curves.select({model: selected, metric: key[0], group: key[1]});
    if (tab === "fits") {
      const conditions = {model: selected, kind: scope};
      if (choice) conditions.series = key[1];
      rows = (data.annual && byId("resolution").value === "annual" ? data.annual.fits : data.fits).select(conditions);
    }
    if (tab === "compositions") {
      const conditions = {model: selected, axis: scope};
      if (choice) conditions.series = key[1];
      if (choice && byId("sample").value && byId("sample").value !== allSeries) {
        const [time, record] = JSON.parse(byId("sample").value);
        conditions.time = time;
        conditions.record = value => (value == null ? null : String(value)) === record;
      }
      rows = data.compositions.select(conditions);
    }
    if (tab === "reports" && choice) rows = unpack(data.views[key[0]].rows);
    if (tab === "checks") rows = data.checks;
    if (tab === "tables" && choice) {
      const source = data.tables[key[0]];
      rows = unpack(source.rows).map(r => ({...r, model: source.model, label: source.label}));
    }
    rows = rows.filter(r => selected.has(r.model));
    if (tab === "fits" && byId("residual").checked) rows = rows.map(r => ({...r,
      residual: Number.isFinite(r.observed) && Number.isFinite(r.predicted) ? r.observed - r.predicted : null}));
    tablePage = Math.min(tablePage, Math.max(0, Math.ceil(rows.length / 100) - 1));
    currentRows = rows;
    currentColumns = unique(rows.flatMap(Object.keys));
    byId("plot-title").textContent = choice ? choice.label + (tab === "compositions" ? ` · ${byId("sample").selectedOptions[0]?.textContent || ""}` : "") :
      tab === "fits" ? fitNames[scope] || `${pretty(scope)} fits` : tab === "compositions" ? axisNames[scope] || `${pretty(scope)} compositions` : "No data in this view";
    byId("definition").textContent = ["series", "curves", "reports"].includes(tab) ? rows[0]?.definition || "" :
      tab === "fits" ? (byId("residual").checked ? "Raw residuals: observed minus predicted, in original units." :
        (data.type === "hindcast" ? "Observations (black) and held-out predictions (coloured dashed lines). Vertical marks identify training cutoffs; Study plots shows prediction skill." :
        `${scope === "index" ? "Observed index values" : scope === "catch" ? "Recorded catches" : scope === "tag" ? "Observed tag recaptures" : "Observed values"} (points) and model predictions (lines).`)) :
      tab === "compositions" ? (compositionOverview() ?
        "Observed bars and predicted lines. Common-bin samples are pooled using raw sample counts; other samples are shown separately. Choose a fishery to inspect individual samples." :
        "Observed proportions (bars) and predicted proportions (line) for the selected sample.") :
      tab === "checks" ? "Inspect each recorded check and threshold. Unknown checks are not passes." : "Supplied model table.";
    mathText(byId("definition"), byId("definition").textContent);
    if (data.annual && byId("resolution").value === "annual" && tab === "fits" && !byId("residual").checked)
      byId("definition").append(document.createTextNode(scope === "catch" || scope === "tag" ?
        " Annual totals." : " Annual geometric means."));
    byId("chart").replaceChildren(); byId("legend").replaceChildren(); byId("hover").textContent = "";
    const chartable = ["series", "curves", "reports", "fits", "compositions"].includes(tab) && rows.length > 0;
    byId("chart").hidden = !chartable;
    byId("download-svg").hidden = !chartable;
    byId("download-csv").disabled = !rows.length;
    byId("data-details").open = ["checks", "tables"].includes(tab);
    byId("data-details").hidden = !rows.length;
    byId("sample-pages").hidden = true;
    if (chartable) drawPanels(rows);
    else if (!rows.length) {
      byId("chart").hidden = false;
      byId("chart").append(node("p", selected.size ? "This selection has no data." : "Select a model to see its results.", "empty"));
    }
    table(rows);
  }

  function table(rows) {
    byId("table").replaceChildren();
    byId("table-note").textContent = rows.length ? `${rows.length.toLocaleString()} rows. ` +
      (rows.length > 100 ? "Browse pages or download all rows." : "Exact values are available below.") : "";
    const pages = Math.max(1, Math.ceil(rows.length / 100));
    byId("page-number").textContent = `${tablePage + 1} / ${pages}`;
    byId("previous-page").disabled = tablePage === 0;
    byId("next-page").disabled = tablePage >= pages - 1;
    document.querySelector("#data-details .table-pages").hidden = pages === 1;
    if (!rows.length) return;
    const table = node("table"); const head = node("thead"); const tr = node("tr");
    currentColumns.forEach(c => { const th = node("th", pretty(c)); th.scope = "col"; tr.append(th); });
    head.append(tr); table.append(head);
    const body = node("tbody");
    rows.slice(tablePage * 100, (tablePage + 1) * 100).forEach(r => {
      const row = node("tr"); currentColumns.forEach(c => row.append(node("td", format(r[c])))); body.append(row);
    });
    table.append(body); byId("table").append(table);
  }

  function compositionOverview() {
    return tab === "compositions" && (byId("quantity").value === allSeries || byId("sample").value === allSeries);
  }
  function compositionPanels(rows) {
    const key = row => JSON.stringify([row.model, row.axis, row.series, row.bin_unit, row.condition_bin]);
    const pooled = new Map();
    for (const row of data.composition_summaries.select({model: selected, axis: scope})) {
      const id = key(row);
      if (!pooled.has(id)) pooled.set(id, []);
      pooled.get(id).push({...row, pooled: true});
    }
    const samples = new Map(), result = new Map();
    for (const row of rows) {
      const id = key(row);
      if (pooled.has(id)) { result.set(id, pooled.get(id)); continue; }
      const sample = JSON.stringify([id, row.time, row.record]);
      if (!samples.has(sample)) { samples.set(sample, []); result.set(sample, samples.get(sample)); }
      samples.get(sample).push(row);
    }
    return [...result.values()];
  }

  // Split by series before drawing: never connect different fisheries or
  // composition records into a model line. Only compatible stock axes are shared.
  function drawPanels(rows) {
    const overview = compositionOverview();
    const split = new Map();
    for (const row of rows) {
      const key = tab === "series" ? row.group : tab === "fits" ? JSON.stringify([row.series, row.unit]) :
        overview ? JSON.stringify([row.series, row.model, row.bin_unit]) : tab === "reports" && row.facet ? row.facet : "all";
      if (!split.has(key)) split.set(key, []);
      split.get(key).push(row);
    }
    let panels = overview ? compositionPanels(rows) : [...split.values()];
    const pageSize = 18;
    if (overview && panels.length > 24) {
      const pages = Math.ceil(panels.length / pageSize);
      samplePage = Math.max(0, Math.min(samplePage, pages - 1));
      byId("sample-pages").hidden = false;
      byId("sample-page-number").textContent = `${samplePage * pageSize + 1}–${Math.min(panels.length, (samplePage + 1) * pageSize)} of ${panels.length} panels`;
      byId("previous-samples").disabled = samplePage === 0;
      byId("next-samples").disabled = samplePage === pages - 1;
      panels = panels.slice(samplePage * pageSize, (samplePage + 1) * pageSize);
    }
    if (tab === "series") panels.sort((a, b) => (a[0].group === "all") - (b[0].group === "all"));
    if (panels.length < 2 && !overview) { draw(rows); return; }
    const width = Math.max(320, Math.min(1100, byId("chart").clientWidth || 900));
    const columns = Math.min(panels.length,
      width >= 1000 && (tab === "fits" || overview) ? 3 : width >= 740 ? 2 : 1);
    const gap = 16, panelWidth = (width - gap * (columns - 1)) / columns;
    const compatible = tab === "series" && unique(rows.map(r => JSON.stringify([r.unit, r.axis_label || ""]))).length === 1;
    const charts = panels.map(part => {
      const row = part[0];
      const label = tab === "series" ? groupLabel(row) : tab === "reports" ? row.facet : (row.series_label || row.series) +
        (overview && selected.size > 1 ? ` / ${row.label}` : "") +
        (overview && row.condition_bin != null ? ` · ${format(row.condition_bin)} ${row.condition_unit || ""}` : "") +
        (overview && !row.pooled ? ` · ${format(row.time)} · ${row.record}` : "");
      return draw(part, {width: panelWidth, label, axisRows: compatible ? rows : part,
        compact: tab === "fits" || overview, legend: false});
    }).filter(Boolean);
    if (!charts.length) return;
    const tileHeight = Math.max(...charts.map(svg => svg.viewBox.baseVal.height));
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("xmlns", "http://www.w3.org/2000/svg");
    svg.setAttribute("viewBox", `0 0 ${width} ${Math.ceil(charts.length / columns) * (tileHeight + gap) - gap}`);
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", byId("plot-title").textContent);
    charts.forEach((chart, i) => {
      chart.setAttribute("x", (i % columns) * (panelWidth + gap));
      chart.setAttribute("y", Math.floor(i / columns) * (tileHeight + gap));
      chart.setAttribute("width", panelWidth); chart.setAttribute("height", chart.viewBox.baseVal.height);
      svg.append(chart);
    });
    if (!overview) {
      const present = data.models.filter(m => rows.some(r => r.model === m.id));
      const legend = document.createElementNS("http://www.w3.org/2000/svg", "g");
      let x = 20, y = Math.ceil(charts.length / columns) * (tileHeight + gap) + 8;
      for (const model of present) {
        const size = Math.min(width - 40, model.label.length * 7 + 44);
        if (x + size > width - 20 && x > 20) { x = 20; y += 22; }
        const line = document.createElementNS(svg.namespaceURI, "line");
        for (const [name, value] of Object.entries({x1: x, x2: x + 19, y1: y - 4, y2: y - 4, stroke: color(model.id), "stroke-width": 2.5})) line.setAttribute(name, value);
        const text = document.createElementNS(svg.namespaceURI, "text");
        for (const [name, value] of Object.entries({x: x + 26, y, fill: "#65757d", "font-size": 12, "font-family": "sans-serif"})) text.setAttribute(name, value);
        text.textContent = model.label; legend.append(line, text); x += size;
      }
      svg.append(legend); svg.setAttribute("viewBox", `0 0 ${width} ${y + 20}`);
    }
    byId("chart").append(svg);
  }

  function draw(rows, options = {}) {
    const residual = tab === "fits" && byId("residual").checked;
    const xname = ["curves", "reports"].includes(tab) ? "x" : tab === "compositions" ? "bin" : "time";
    const yname = ["series", "curves", "reports"].includes(tab) ? "value" : residual ? "residual" : "predicted";
    const observations = ["fits", "compositions"].includes(tab) && !residual;
    let axisRows = options.axisRows || rows;
    const hindcast = data.type === "hindcast" && tab === "fits" && !residual;
    let history = [];
    if (hindcast) {
      const times = rows.map(r => r.time), cutoffs = rows.map(r => r.cutoff);
      const window = Math.max(Math.max(...times) - Math.min(...times), ...rows.map(r => r.lead));
      history = hindcastHistory.filter(r => r.series === rows[0].series &&
        r.time >= Math.min(...cutoffs) - window && r.time <= Math.max(...times));
      if (!history.length) history = [...new Map(rows.map(r => [r.time, r])).values()];
      axisRows = [...axisRows, ...history, ...cutoffs.map(time => ({time}))];
    }
    const values = axisRows.flatMap(r => observations ? [r.observed, r.predicted] : [r[yname], r.lower, r.upper]).filter(Number.isFinite);
    if (!values.length) { byId("chart").append(node("p", "No finite values to draw.", "empty")); byId("download-svg").hidden = true; return; }
    const magnitude = values.reduce((m, v) => Math.max(m, Math.abs(v)), 0);
    const scalable = !rows[0].axis_label && ["t", "kg", "fish", "number", "model biomass units", "model abundance units", "count"].includes(rows[0].unit);
    const exponent = scalable ? (magnitude >= 1e6 ? 6 : magnitude >= 1e4 ? 3 : 0) : 0;
    const divisor = 10 ** exponent;
    const displayRow = {...rows[0], unit: exponent ? `10^${exponent} ${rows[0].unit}` : rows[0].unit};
    const width = options.width || Math.max(320, Math.min(900, byId("chart").clientWidth || 900));
    const height = options.compact ? 240 : options.label ? 320 : 390;
    const left = options.compact ? 70 : 90, right = 25, bottom = 55;
    const labelLines = [];
    if (options.label) {
      const limit = Math.max(16, Math.floor((width - left - right) / 6.5));
      let line = "";
      for (const word of options.label.split(/\s+/)) {
        if (line && (line + " " + word).length > limit) { labelLines.push(line); line = word; }
        else line += (line ? " " : "") + word;
      }
      labelLines.push(line);
    }
    const top = options.label ? 22 + labelLines.length * 14 : 22;
    const lineId = r => tab === "reports" ? JSON.stringify([r.model, r.line]) : r.model;
    const lineModels = tab === "reports" ? unique(rows.map(lineId)).map(id => {
      const r = rows.find(r => lineId(r) === id);
      return {id, label: data.models.length > 1 ? `${r.label} / ${r.line}` : r.line};
    }) : data.models.filter(m => selected.has(m.id) && rows.some(r => r.model === m.id));
    const lineColor = id => tab === "reports" ? palettes[lineModels.findIndex(m => m.id === id) % palettes.length] : color(id);
    const legendModels = options.legend === false || (tab === "compositions" && lineModels.length === 1) ? [] : lineModels.filter(m => rows.some(r => lineId(r) === m.id));
    const legendPositions = [];
    let legendX = left, legendY = height + 18;
    for (const model of legendModels) {
      const size = Math.min(width - left - right, model.label.length * 7 + 44);
      if (legendX + size > width - right && legendX > left) { legendX = left; legendY += 22; }
      legendPositions.push({model, x: legendX, y: legendY}); legendX += size;
    }
    const totalHeight = options.legend === false ? height + 10 : legendY + 18;
    let [xmin, xmax] = extent(axisRows.map(r => r[xname]).filter(Number.isFinite));
    const references = unique(rows.map(r => r.reference_line).filter(Number.isFinite));
    let [ymin, ymax] = extent([...values, ...references]);
    ymin = Math.min(0, ymin); ymax = Math.max(0, ymax);
    const binEdges = new Map();
    if (tab === "compositions") {
      const bins = unique(rows.map(r => r.bin)).sort((a, b) => a - b);
      bins.forEach((bin, i) => {
        const row = rows.find(r => r.bin === bin);
        const lower = Number.isFinite(row.bin_lower) ? row.bin_lower : bin - (i ? bin - bins[i-1] : bins.length > 1 ? bins[1] - bin : 1) / 2;
        const upper = Number.isFinite(row.bin_upper) ? row.bin_upper : bin + (i < bins.length-1 ? bins[i+1] - bin : i ? bin - bins[i-1] : 1) / 2;
        binEdges.set(bin, [lower, upper]);
      });
      [xmin, xmax] = extent([...binEdges.values()].flat());
    }
    if (xmin === xmax) { xmin -= .5; xmax += .5; }
    const pad = (ymax - ymin || Math.max(Math.abs(ymax), 1)) * .08;
    if (ymin < 0) ymin -= pad;
    ymax += pad;
    const px = x => left + (x - xmin) / (xmax - xmin) * (width - left - right);
    const py = y => height - bottom - (y - ymin) / (ymax - ymin) * (height - top - bottom);
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", `0 0 ${width} ${totalHeight}`);
    svg.setAttribute("xmlns", "http://www.w3.org/2000/svg");
    svg.setAttribute("aria-label", byId("plot-title").textContent);
    const el = (tag, attrs, text) => {
      const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
      Object.entries(attrs).forEach(([key, value]) => n.setAttribute(key, String(value)));
      if (text !== undefined) n.textContent = text;
      svg.append(n); return n;
    };
    const text = (x, y, content, anchor = "middle") => el("text", {x, y, fill: "#65757d",
      "font-size": 12, "font-family": "sans-serif", "text-anchor": anchor}, content);
    el("rect", {width, height: totalHeight, fill: "white"});
    el("desc", {}, byId("definition").textContent);
    labelLines.forEach((label, i) => text(left, 16 + 14 * i, label, "start"));
    for (const tick of ticks(ymin / divisor, ymax / divisor)) {
      const value = tick * divisor;
      el("line", {x1: left, x2: width - right, y1: py(value), y2: py(value), stroke: "#e8edef"});
      text(left - 12, py(value) + 4, format(tick), "end");
    }
    const xMagnitude = Math.max(Math.abs(xmin), Math.abs(xmax));
    const xScalable = tab === "reports" && ["t", "kg", "fish", "number", "model biomass units", "model abundance units"].includes(rows[0].x_unit);
    const xExponent = xScalable ? (xMagnitude >= 1e6 ? 6 : xMagnitude >= 1e4 ? 3 : 0) : 0;
    const xDivisor = 10 ** xExponent;
    for (const value of ticks(xmin / xDivisor, xmax / xDivisor, !xExponent && rows.every(r => Number.isInteger(r[xname]))))
      text(px(value * xDivisor), height - bottom + 25, value.toLocaleString("en", {useGrouping: false, maximumFractionDigits: 6}));
    const timeLabels = unique(data.models.map(m => m.metadata.time_label).filter(Boolean));
    let xLabel = tab === "reports" ? rows[0].x_label : tab === "curves" ? pretty(rows[0].x_unit) : xname === "time" ? (timeLabels.length === 1 ? timeLabels[0] : "Time") :
      (rows[0].axis === "conditional_age" ? "Age" : pretty(rows[0].axis)) + (rows[0].bin_unit ? ` (${rows[0].bin_unit})` : "");
    if (xExponent) xLabel = xLabel.replace(`(${rows[0].x_unit})`, `(10^${xExponent} ${rows[0].x_unit})`);
    const xAxisLabel = text(width / 2, height - 5, xLabel);
    const fitLabel = residual ? "Residual" : rows[0].kind === "index" ?
      (displayRow.unit === "geometric-mean-scaled index" ? "Relative index" : "Abundance index") :
      rows[0].kind === "tag" ? "Tag recaptures" : rows[0].kind ? pretty(rows[0].kind) : "";
    const dimensionless = ["ratio", "relative", "probability", "relative abundance", "geometric-mean-scaled index"].includes(displayRow.unit);
    const yLabel = ["series", "curves", "reports"].includes(tab) ? quantityLabel(displayRow) : tab === "compositions" ? (rows[0].unit === "count" ? `Sample count${exponent ? ` (10^${exponent})` : ""}` : "Proportion") :
      fitLabel + (dimensionless ? "" : ` (${displayRow.unit})`);
    const axisLabel = text(16, (height - bottom + top) / 2, yLabel);
    mathText(axisLabel, yLabel);
    mathText(xAxisLabel, xLabel);
    axisLabel.setAttribute("transform", `rotate(-90 16 ${(height - bottom + top) / 2})`);
    if (residual) el("line", {x1: left, x2: width - right, y1: py(0), y2: py(0), stroke: "#839199", "stroke-dasharray": "4 4"});
    for (const value of references) el("line", {x1: left, x2: width - right, y1: py(value), y2: py(value),
      stroke: "#839199", "stroke-dasharray": "4 4", "data-reference": value});
    if (hindcast) {
      let path = "", segment = false;
      for (const p of [...history].sort((a, b) => a.time - b.time)) {
        if (!Number.isFinite(p.observed)) { segment = false; continue; }
        path += `${segment ? "L" : "M"}${px(p.time)},${py(p.observed)} `; segment = true;
        el("circle", {cx: px(p.time), cy: py(p.observed), r: 3, fill: "#283e48", "data-hindcast-observed": p.observed});
      }
      el("path", {d: path, fill: "none", stroke: "#283e48", "stroke-width": 1.3});
      for (const model of lineModels) {
        const cutoff = rows.find(r => r.model === model.id)?.cutoff;
        if (Number.isFinite(cutoff)) el("line", {x1: px(cutoff), x2: px(cutoff), y1: top, y2: height - bottom,
          stroke: lineColor(model.id), "stroke-opacity": .3, "stroke-dasharray": "3 4", "data-cutoff": cutoff});
      }
    }
    for (const model of lineModels) {
      const points = rows.filter(r => lineId(r) === model.id).sort((a, b) => a[xname] - b[xname]);
      if (!points.length) continue;
      if (tab === "reports" && points.some(p => Number.isFinite(p.lower) && Number.isFinite(p.upper))) {
        for (const probability of unique(points.map(p => p.probability))) {
          const band = points.filter(p => p.probability === probability);
          let run = [];
          const flush = () => {
            if (run.length > 1) el("polygon", {points: [...run.map(p => `${px(p[xname])},${py(p.lower)}`),
              ...[...run].reverse().map(p => `${px(p[xname])},${py(p.upper)}`)].join(" "),
              fill: lineColor(model.id), "fill-opacity": .13, stroke: "none"});
            run = [];
          };
          for (const p of band) {
            if (Number.isFinite(p.lower) && Number.isFinite(p.upper)) run.push(p); else flush();
          }
          flush();
        }
      }
      if (tab === "compositions") for (const p of points.filter(p => Number.isFinite(p.observed))) {
        const edge = binEdges.get(p.bin);
        el("rect", {x: px(edge[0]), y: py(p.observed), width: Math.max(0, px(edge[1]) - px(edge[0])),
          height: Math.max(0, py(0) - py(p.observed)), fill: "#a9cdd0", stroke: "white", "stroke-width": .5,
          "data-observed": p.observed, "data-bin": p.bin, "fill-opacity": lineModels.length > 1 ? .55 : 1});
      }
      let path = "", segment = false;
      for (const p of points) {
        if (!Number.isFinite(p[yname])) { segment = false; continue; }
        path += `${segment ? "L" : "M"}${px(p[xname])},${py(p[yname])} `;
        segment = true;
        if (residual || hindcast || points.length === 1 || rows[0].metric === "MASE") el("circle", {cx: px(p[xname]), cy: py(p[yname]), r: 3, fill: hindcast ? "white" : lineColor(model.id), stroke: lineColor(model.id)});
      }
      if (!residual) el("path", {d: path, fill: "none", stroke: tab === "compositions" && lineModels.length === 1 ? "#756294" : lineColor(model.id), "stroke-width": 2.5,
        "data-predicted": tab === "compositions" ? "true" : "false",
        "stroke-dasharray": data.type === "hindcast" ? "6 4" : "none", "stroke-linejoin": "round"});
      if (data.type === "retrospective" && tab === "series") {
        const end = points[points.length - 1];
        if (Number.isFinite(end[yname])) el("circle", {cx: px(end[xname]), cy: py(end[yname]), r: 4, fill: lineColor(model.id)});
      }
      if (observations && tab !== "compositions" && !hindcast) points.filter(p => Number.isFinite(p.observed)).forEach(p =>
        el("circle", {cx: px(p[xname]), cy: py(p.observed), r: 3.5, fill: "white", stroke: lineColor(model.id), "stroke-width": 1.5}));
    }
    for (const item of legendPositions) {
      el("line", {x1: item.x, x2: item.x + 19, y1: item.y - 4, y2: item.y - 4, stroke: lineColor(item.model.id), "stroke-width": 2.5});
      text(item.x + 26, item.y, item.model.label, "start");
    }
    if (tab === "compositions" && rows[0].pooled) {
      svg.setAttribute("data-samples", rows[0].n_samples);
      svg.setAttribute("data-unit", rows[0].unit);
    }
    const cursor = el("line", {x1: 0, x2: 0, y1: top, y2: height - bottom, stroke: "#93a6af", visibility: "hidden"});
    svg.addEventListener("pointermove", event => {
      const rect = svg.getBoundingClientRect();
      const x = (event.clientX - rect.left) / rect.width * width;
      const target = xmin + (x - left) / (width - left - right) * (xmax - xmin);
      const nearest = rows.reduce((a, b) => Math.abs(a[xname] - target) < Math.abs(b[xname] - target) ? a : b)[xname];
      cursor.setAttribute("x1", px(nearest)); cursor.setAttribute("x2", px(nearest)); cursor.setAttribute("visibility", "visible");
      byId("hover").textContent = `${format(nearest)} · ` + rows.filter(r => r[xname] === nearest)
        .map(r => `${r.label}: ${format(r[yname])}${observations ? ` (observed ${format(r.observed)})` : ""}`).join(" · ");
    });
    svg.addEventListener("pointerleave", () => cursor.setAttribute("visibility", "hidden"));
    byId("chart").append(svg);
    return svg;
  }

  function download(content, type, filename) {
    const url = URL.createObjectURL(new Blob([content], {type}));
    const link = node("a"); link.href = url; link.download = filename; link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  byId("download-csv").addEventListener("click", () => {
    const quote = value => '"' + String(value == null ? "" : value).replaceAll('"', '""') + '"';
    const csv = [currentColumns.map(quote).join(","), ...currentRows.map(row =>
      currentColumns.map(c => quote(row[c])).join(","))].join("\r\n");
    download(csv, "text/csv;charset=utf-8", `${tab}-data.csv`);
  });
  byId("download-svg").addEventListener("click", () => {
    const svg = byId("chart").querySelector("svg");
    if (svg) download(new XMLSerializer().serializeToString(svg), "image/svg+xml", `${tab}-comparison.svg`);
  });
  let resize;
  window.addEventListener("resize", () => { clearTimeout(resize); resize = setTimeout(render, 100); });
  function openRequestedTab() {
    const requested = location.hash ? tabs.find(view => tabId(view) === location.hash.slice(1)) : tabs[0];
    if (requested) { tab = requested.type; scope = requested.scope || null; activeTab = tabId(requested); }
    controls(); render();
  }
  window.addEventListener("hashchange", openRequestedTab);
  openRequestedTab();
})();</script></body></html>
